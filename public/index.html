<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SBE Assistant</title>
    <link rel="manifest" href="manifest.json" />
    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: sans-serif;
      }
      .app-container {
        display: grid;
        /* Cấu trúc 3 cột: Nửa trái (60%) - Thanh kéo (5px) - Nửa phải (Phần còn lại) */
        grid-template-columns: 60% 5px 1fr;
        height: 100vh;
      }

      /* Giao diện thanh kéo thả */
      .resizer {
        background-color: #ddd;
        cursor: col-resize;
        z-index: 10;
        transition: background-color 0.2s;
      }

      .resizer:hover,
      .resizer:active {
        background-color: #007acc; /* Đổi màu xanh khi di chuột hoặc đang kéo */
      }
      .ai-chat-section {
        background-color: #f4f4f9;
        padding: 20px;
        display: flex;
        flex-direction: column;
        border-right: 1px solid #ddd;
      }
      .gherkin-editor-section {
        background-color: #1e1e1e;
        color: #d4d4d4;
        padding: 20px;
        display: flex;
        flex-direction: column;
      }
      .chat-history {
        flex-grow: 1;
        overflow-y: auto;
        margin-bottom: 10px;
      }
      .editor-textarea {
        flex-grow: 1;
        background: #1e1e1e;
        color: #d4d4d4;
        border: 1px solid #333;
        padding: 10px;
        font-family: monospace;
        resize: none;
      }
      .toolbar {
        padding-top: 10px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      button {
        padding: 8px 16px;
        cursor: pointer;
        background: #007acc;
        color: white;
        border: none;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div class="app-container" id="appContainer">
      <!-- Nửa trái: AI Mentor Chatbox -->
      <div class="ai-chat-section">
        <div class="chat-history" id="chatHistory">
          <p>
            <strong>SBE Mentor:</strong> Chào bạn, chúng ta bắt đầu Tuần 1. Hãy
            viết kịch bản Gherkin đầu tiên sang ô bên phải nhé.
          </p>
        </div>
        <div style="display: flex; gap: 10px; padding-bottom: 10px">
          <select id="weekSelector" style="padding: 10px; border-radius: 4px">
            <option value="1">Tuần 1: Nền tảng Gherkin</option>
            <option value="2">Tuần 2: Scenario Outlines</option>
            <option value="3">Tuần 3: Outside-In & Edge Cases</option>
            <option value="4">Tuần 4: Living Documentation</option>
          </select>
        </div>
        <div style="display: flex; gap: 10px">
          <input
            type="text"
            id="chatInput"
            style="flex-grow: 1; padding: 10px"
            placeholder="Nhắn tin tự do với Mentor..."
          />
          <button id="btnRecall">Tổng kết (Recall)</button>
        </div>
      </div>
      <!-- THANH KÉO THẢ NẰM Ở GIỮA -->
      <div class="resizer" id="dragMe"></div>
      <!-- Nửa phải: Gherkin Workspace -->
      <div class="gherkin-editor-section">
        <textarea
          id="gherkinEditor"
          class="editor-textarea"
          placeholder="Feature: ...&#10;Scenario: ..."
        ></textarea>
        <div class="toolbar">
          <button id="btnSendScenario">Gửi Kịch bản</button>
        </div>
      </div>
    </div>

    <!-- Nạp file JS sau khi biên dịch từ TypeScript -->
    <script type="module" src="js/index.js"></script>
  </body>
</html>
